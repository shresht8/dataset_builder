[project]
name = "groundline-schema"
version = "0.1.0"
description = "Shared schema, column types, manifest and JSON Schema sidecar for Groundline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",             # shared yaml rendering for API export + CLI pull (GL-3.5-13)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundline_schema"]

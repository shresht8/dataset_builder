[project]
name = "groundline-api"
version = "0.1.0"
description = "Groundline dataset builder API"
requires-python = ">=3.11"
dependencies = [
    "groundline-schema",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "authlib",            # OIDC / PKCE (§5)
    "httpx",              # OIDC discovery/token/JWKS calls (GL-3-11)
    "boto3",              # S3-compatible snapshot storage (§6)
    "python-multipart",   # multipart import upload (§4)
    "openpyxl",           # XLSX import (§4)
    "pyyaml",             # YAML export (§7)
    "jsonschema",         # per-column JSON Schema for `json` columns (GL-3.5-13)
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundline_api"]

# shared/ is a sibling path dependency; installed via `make install`
[tool.uv.sources]
groundline-schema = { path = "../shared", editable = true }

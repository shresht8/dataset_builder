# Local development services. Not for production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: groundline
      POSTGRES_PASSWORD: groundline
      POSTGRES_DB: groundline
    # Host port only matters for tools outside compose (make run, psql). If
    # 5432 is taken on your machine, set POSTGRES_HOST_PORT in infra/.env.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundline -d groundline"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Containerised API (GL-1-11). Runs migrations on start, then uvicorn.
  # Start/stop just this service:
  #   docker compose -f infra/docker-compose.yml up -d --build api
  #   docker compose -f infra/docker-compose.yml stop api
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://groundline:groundline@postgres:5432/groundline
      STORAGE_ENDPOINT_URL: http://storage:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-groundline}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      APP_ENV: ${APP_ENV:-dev}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      PAT_DEFAULT_TTL_DAYS: ${PAT_DEFAULT_TTL_DAYS:-90}
      # Entra SSO (GL-3-11/GL-3-12). OFF unless AUTH_SSO_ENABLED=true; the
      # defaults below point at the local mock IdP (`sso-mock` profile) and
      # are MOCK-ONLY values. Real Entra: see infra/ENTRA-SETUP.md.
      AUTH_SSO_ENABLED: ${AUTH_SSO_ENABLED:-false}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://mock-oidc.localhost:8090/entra/.well-known/openid-configuration}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-groundline-local}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-mock-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:5173/v1/auth/sso/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile,email}
      # Mock fixture group GUIDs -> roles. Literal (compose can't put `{}`
      # in a ${VAR:-default}); for real Entra, replace with your tenant's
      # group object IDs.
      ROLE_MAPPING: >-
        {"a1a1a1a1-0000-4000-8000-000000000001":"admin",
        "e2e2e2e2-0000-4000-8000-000000000002":"editor",
        "a3a3a3a3-0000-4000-8000-000000000003":"annotator",
        "default":"viewer"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # S3-compatible object storage for version snapshots (§6). Was MinIO;
  # switched to RustFS 2026-09-27 because `minio/minio` is no longer
  # pullable (see infra/README.md for details).
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket provisioning (GL-3-1, C1). App code never creates
  # buckets: this container creates the snapshot bucket, then exits 0.
  # Re-running `make db-up` is safe (head_bucket + create-if-missing).
  #
  # Uses boto3 (already a backend dependency, see backend/pyproject.toml)
  # inside the api image instead of an S3 client image: `minio/mc` has been
  # pulled from Docker Hub and its quay.io replacement requires registry
  # login, so neither pulls anonymously. RustFS ships no equivalent CLI
  # image either, so this approach stands regardless of which S3-compatible
  # server backs `storage`.
  storage-init:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      storage:
        condition: service_healthy
    environment:
      STORAGE_ENDPOINT_URL: http://storage:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-groundline}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
    command:
      - python
      - -c
      - |
        import os
        import boto3
        from botocore.exceptions import ClientError

        s3 = boto3.client(
            "s3",
            endpoint_url=os.environ["STORAGE_ENDPOINT_URL"],
            aws_access_key_id=os.environ["STORAGE_ACCESS_KEY"],
            aws_secret_access_key=os.environ["STORAGE_SECRET_KEY"],
        )
        bucket = os.environ["STORAGE_BUCKET"]
        try:
            s3.head_bucket(Bucket=bucket)
            print(f"bucket exists: {bucket}")
        except ClientError:
            s3.create_bucket(Bucket=bucket)
            print(f"bucket created: {bucket}")
    restart: "no"

  # Mock Entra ID (OIDC) for local SSO (GL-3-12). Only with the profile:
  #   docker compose -f infra/docker-compose.yml --profile sso-mock up -d
  # Hostname split: the browser (authorize redirect) and the api container
  # (discovery/token/JWKS) must see the SAME issuer, and this mock derives
  # the issuer from the request Host. Browsers and curl resolve any
  # `*.localhost` name to 127.0.0.1, and inside compose the network alias
  # below resolves to this container; listening on 8090 on both sides makes
  # `http://mock-oidc.localhost:8090` identical from host and container.
  # 8090 because 8080 is often taken. MOCK-ONLY - never a real IdP.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    profiles: ["sso-mock"]
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - "8090:8090"
    networks:
      default:
        aliases:
          - mock-oidc.localhost

volumes:
  pgdata:
  storagedata:
